add_newline = false
command_timeout = 2000

format = """\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"

[character]
format = "$symbol "
# success_symbol = "[»](bold green)"
# error_symbol = "[»](bold red)"

[directory]
style = "bold green"
truncation_length = 1
truncate_to_repo = false

[git_branch]
format = '[$branch(:$remote_branch)]($style) '
style = "yellow"

[git_status]
untracked = ""

[git_metrics]
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[java]
disabled = true

[time]
disabled = false
format = "[$time]($style) "
style = "bright-blue"

[vagrant]
disabled = true

[cmd_duration]
min_time = 5000
